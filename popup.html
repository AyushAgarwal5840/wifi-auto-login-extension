<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="container" class="status-checking">

    <h2>WiFi Auto Login</h2>

    <label>
        Username:
        <input type="text" id="username">
    </label>

    <label>
        Password:
        <input type="password" id="password">
    </label>

    <label class="toggle">
        <input type="checkbox" id="enabled">
        Enable Auto Login
    </label>

    <button id="save">Save</button>

    <hr>

    <h3>Status</h3>
    <p id="statusText"></p>

    <h3>Recent Logs</h3>
    <div id="logs"></div>

</div>

<script src="popup.js"></script>

</body>
</html>
